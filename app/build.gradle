apply plugin: 'com.android.application'

android {
    // AGP 8 不再从清单读 package，改由 namespace 提供
    namespace 'com.filmbox.archive'
    compileSdk 34

    // 显式钉住，否则 AGP 可能自作主张去下 35.0.0（sdkmanager 走 dl.google.com）
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.filmbox.archive'
        // 29 (Android 10) 而不是 24：MediaStore 从 29 起支持 RELATIVE_PATH +
        // IS_PENDING，写相册不需要任何权限。24–28 要 WRITE_EXTERNAL_STORAGE 运行时
        // 授权，而那条路径在本机无法验证（模拟器是 API 35）—— 与其塞一段没测过的
        // 权限流程，不如把下限提到 Android 10。2026 年这覆盖 97%+ 在用设备。
        minSdk 29
        targetSdk 34
        // 覆盖安装现有演示版的前提：applicationId 不变 + 同一把签名密钥
        versionCode 2
        versionName '0.2.0'

        // MediaPipe 的原生库四个 ABI 加起来约 48 MB，只留 arm64-v8a。
        // 这不是优化，是必需。
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            storeFile file('../demo.keystore')
            storePassword 'filmbox'
            keyAlias 'filmbox'
            keyPassword 'filmbox'
        }
    }

    buildTypes {
        release {
            // MediaPipe 用反射和 ServiceLoader，R8 出问题的代价远大于省下的 1 MB
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // AGP 8 默认不再生成 BuildConfig，Bridge.appInfo() 要用版本号
    buildFeatures {
        buildConfig true
    }

    // tflite 模型不能压缩，MediaPipe 要按内存映射直接读
    androidResources {
        noCompress += ['tflite', 'task']
    }

    lint {
        // assembleRelease 会挂上 lintVitalRelease，它会拉整个 lint 依赖树并可能
        // 在不相关的检查上硬失败。构建脚本里同时用 -x lintVitalRelease 跳过。
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // WebViewAssetLoader：把界面挂到真实的 https 源上，照片才能用普通 <img> 原生
    // 加载（而不是 base64 往返），localStorage 才有稳定源，将来 canvas 合成导出
    // 也不会被 file:// 源污染（污染后 toDataURL() 直接抛异常）
    //
    // 版本钉死的原因：androidx.core 1.15+ 要求 compileSdk 35，1.17+ 要求 36。
    // 我们只有 platform-34，sdkmanager 又没有镜像支持，所以不能让它往上漂。
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.core:core:1.13.1'

    // MediaPipe 的 Interactive Segmenter：点一下主体就把它抠出来。
    //
    // 为什么不用 ML Kit 的主体分割：它是 unbundled 的，模型走 Google Play 服务
    // 动态下载。国内手机要么没装 GMS，要么下不到模型，功能会直接失效。
    // MediaPipe 是纯端上推理，模型打进 APK，运行时完全不联网。
    //
    // 这个依赖会通过 tasks-core -> datatransport 带进 INTERNET /
    // ACCESS_NETWORK_STATE 和三个后台组件（含一个 AlarmManager 定时上传调度器）。
    // 清单里用 tools:node="remove" 全部摘掉 —— 一个宣称"不经过任何服务器"的
    // 归档 App 不能带这些。构建后要用 dumpsys 验证。
    implementation 'com.google.mediapipe:tasks-vision:1.0.0'
}
