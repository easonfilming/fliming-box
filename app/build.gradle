apply plugin: 'com.android.application'

android {
    // AGP 8 不再从清单读 package，改由 namespace 提供
    namespace 'com.filmbox.archive'
    compileSdk 34

    // 显式钉住，否则 AGP 可能自作主张去下 35.0.0（sdkmanager 走 dl.google.com）
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.filmbox.archive'
        // 29 (Android 10) 而不是 24：MediaStore 从 29 起支持 RELATIVE_PATH +
        // IS_PENDING，写相册不需要任何权限。24–28 要 WRITE_EXTERNAL_STORAGE 运行时
        // 授权，而那条路径在本机无法验证（模拟器是 API 35）—— 与其塞一段没测过的
        // 权限流程，不如把下限提到 Android 10。2026 年这覆盖 97%+ 在用设备。
        minSdk 29
        targetSdk 34
        // 覆盖安装现有版本的前提：applicationId 不变 + 同一把签名密钥
        // 每次打包记得 +1 —— 构建脚本会把当前版本号打出来
        versionCode 15
        versionName '0.9.0'

        // 没有原生库了（MediaPipe 已移除），所以不限制 ABI ——
        // arm64 / armeabi-v7a / x86_64 都能装。
    }

    signingConfigs {
        release {
            storeFile file('../demo.keystore')
            storePassword 'filmbox'
            keyAlias 'filmbox'
            keyPassword 'filmbox'
        }
    }

    buildTypes {
        release {
            // MediaPipe 用反射和 ServiceLoader，R8 出问题的代价远大于省下的 1 MB
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // AGP 8 默认不再生成 BuildConfig，Bridge.appInfo() 要用版本号
    buildFeatures {
        buildConfig true
    }

    // tflite 模型不能压缩，MediaPipe 要按内存映射直接读
    androidResources {
        noCompress += ['tflite', 'task']
    }

    lint {
        // assembleRelease 会挂上 lintVitalRelease，它会拉整个 lint 依赖树并可能
        // 在不相关的检查上硬失败。构建脚本里同时用 -x lintVitalRelease 跳过。
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // WebViewAssetLoader：把界面挂到真实的 https 源上，照片才能用普通 <img> 原生
    // 加载（而不是 base64 往返），localStorage 才有稳定源，将来 canvas 合成导出
    // 也不会被 file:// 源污染（污染后 toDataURL() 直接抛异常）
    //
    // 版本钉死的原因：androidx.core 1.15+ 要求 compileSdk 35，1.17+ 要求 36。
    // 我们只有 platform-34，sdkmanager 又没有镜像支持，所以不能让它往上漂。
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.core:core:1.13.1'

    // 抠图功能已移除。
    //
    // 用的是 MediaPipe Interactive Segmenter（magic_touch），端上推理、不联网，
    // 但实际效果达不到可用标准 —— 背景稍杂就抠不干净，用户反馈「太差了」。
    // 移除后 APK 从约 25 MB 降到约 4 MB（原生库 10.5 MB + 模型 5.9 MB 是大头），
    // 顺带也不用再摘 INTERNET 权限了。
    //
    // 如果以后要做，记得两件事：裸 .tflite 只能配 InteractiveSegmenterLegacy
    // （新 API 要 .task 打包格式，magic_touch 没有），以及阈值下界不能低于 0.5，
    // 否则背景噪点会以半透明形式渗进来。
}
