# 菲林档案 —— Gradle 配置
#
# org.gradle.java.home 是必需的，不是保险：
# PATH 上的 java 是 Oracle JRE 1.8（C:\Program Files (x86)\Common Files\Oracle\Java\javapath），
# JAVA_HOME 一旦没设上，Gradle 8.9 就会用 1.8 启动，AGP 直接报 class version 错误。
# 这里钉死，构建脚本里再设一次 JAVA_HOME，两道保险。
org.gradle.java.home=D:/filmbox-android/toolchain/jdk-17

org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=false

# 缺组件时直接报错，而不是静默去 dl.google.com 挂着 —— 那会表现为构建卡死
android.builder.sdkDownload=false
